# Builds the app on every push to main and publishes the static files
# (dist/, plus the storage API in dist/_api/) to the `deploy` branch. The VPS pulls that branch (see deploy/vps-setup.sh),
# so the server never needs Node.js and GitHub needs no SSH access to the server.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: /api   # store data on the server (server/api.py)

      - name: Add the storage API to the published files
        run: mkdir -p dist/_api && cp server/api.py dist/_api/api.py

      - name: Publish dist/ to the deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
